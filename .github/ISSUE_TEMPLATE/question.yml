name: Question
description: Ask a question about a chapter or example.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Questions should be about the repository's learning materials.
  - type: dropdown
    id: chapter
    attributes:
      label: Chapter
      description: Which numbered chapter directory is your question about?
      options:
        - 01_introduction_nn_dl
        - 02_dl_with_tensorflow
        - 03_dl_with_keras
        - 04_dl_with_pytorch
        - Repository-wide
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Notebook or file
      description: Include the notebook name and cell number, if applicable.
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Include what you tried and where you got stuck.
    validations:
      required: true
